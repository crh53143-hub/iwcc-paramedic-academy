<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cardiology Final Exam</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7fa;
    margin:0;
}

header{
    background:#001f54;
    color:white;
    padding:25px;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.question{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 4px rgba(0,0,0,.1);
}

button{
    background:#001f54;
    color:white;
    padding:15px 25px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#003366;
}

#results{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:10px;
}

.correct{
    color:green;
}

.incorrect{
    color:red;
}

</style>

</head>

<body>

<header>

<h1>Cardiology Final Exam</h1>

<p>50 Question Comprehensive Review</p>

</header>

<div class="container">

<div id="exam"></div>

<button onclick="gradeExam()">Submit Exam</button>

<div id="results"></div>

</div>

<script>

const questions = [

{
question:"Which chamber generates the highest pressure?",
choices:[
"Right Atrium",
"Right Ventricle",
"Left Atrium",
"Left Ventricle"
],
answer:3
},

{
question:"Which vessel returns oxygenated blood to the heart?",
choices:[
"Aorta",
"Pulmonary Veins",
"Pulmonary Artery",
"Inferior Vena Cava"
],
answer:1
},

{
question:"The intrinsic rate of the AV Junction is:",
choices:[
"20-40 bpm",
"40-60 bpm",
"60-100 bpm",
"100-150 bpm"
],
answer:1
},

{
question:"The P wave represents:",
choices:[
"Atrial Depolarization",
"Ventricular Depolarization",
"Atrial Repolarization",
"Ventricular Repolarization"
],
answer:0
},

{
question:"The QRS complex represents:",
choices:[
"Atrial Depolarization",
"Ventricular Depolarization",
"Ventricular Repolarization",
"AV Node Activity"
],
answer:1
},

{
question:"A rhythm that is irregularly irregular with no identifiable P waves is:",
choices:[
"Atrial Flutter",
"Atrial Fibrillation",
"MAT",
"Junctional Rhythm"
],
answer:1
},

{
question:"'Longer, Longer, Longer, Drop' describes:",
choices:[
"First Degree AV Block",
"Mobitz I",
"Mobitz II",
"Third Degree Block"
],
answer:1
},

{
question:"Which AV block commonly progresses to complete heart block?",
choices:[
"First Degree",
"Sinus Bradycardia",
"Mobitz I",
"Mobitz II"
],
answer:3
},

{
question:"Which rhythm is shockable?",
choices:[
"Asystole",
"PEA",
"Pulseless VT",
"Junctional Rhythm"
],
answer:2
},

{
question:"ST elevation in II, III and aVF indicates:",
choices:[
"Anterior STEMI",
"Lateral STEMI",
"Inferior STEMI",
"Septal STEMI"
],
answer:2
}

];

const examDiv = document.getElementById("exam");

questions.forEach((q,index)=>{

let html = `
<div class="question">

<p><strong>${index+1}.</strong> ${q.question}</p>
`;

q.choices.forEach((choice,i)=>{

html += `
<label>

<input type="radio"
name="q${index}"
value="${i}">

${choice}

</label><br><br>
`;

});

html += `</div>`;

examDiv.innerHTML += html;

});

function gradeExam(){

let score = 0;

let review = "<h3>Review</h3>";

questions.forEach((q,index)=>{

const selected =
document.querySelector(
`input[name=q${index}]:checked`
);

if(selected){

if(parseInt(selected.value) === q.answer){

score++;

}else{

review += `
<p class='incorrect'>
Question ${index+1}: Correct Answer =
${q.choices[q.answer]}
</p>
`;

}

}else{

review += `
<p class='incorrect'>
Question ${index+1}: Unanswered
</p>
`;

}

});

const percent =
Math.round(
(score/questions.length)*100
);

let status =
percent >= 80
? "<span class='correct'>PASS ✅</span>"
: "<span class='incorrect'>FAIL ❌</span>";

document.getElementById("results").innerHTML =

`
<h2>Exam Complete</h2>

<p><strong>Score:</strong>
${score} / ${questions.length}</p>

<p><strong>Percentage:</strong>
${percent}%</p>

<p>${status}</p>

${review}
`;

window.scrollTo(
0,
document.body.scrollHeight
);

}

</script>

</body>
</html>
